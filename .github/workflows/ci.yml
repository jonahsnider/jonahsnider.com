name: CI

on: [push, pull_request]

jobs:
  build-and-check:
    name: Build and check
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
      - parallel:
          - name: Check formatting
            run: pnpm run format
          - name: Lint
            run: pnpm run lint
          - name: Check unused code and dependencies
            run: pnpm run knip
          - name: Type check and build for production
            run: pnpm run build
