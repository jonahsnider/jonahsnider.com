name: CI

on: [push, pull_request]

jobs:
  build-and-check:
    name: Build and check
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - parallel:
          - name: Check formatting
            run: pnpm run format
          - name: Lint
            run: pnpm run lint
          - name: Check unused code and dependencies
            run: pnpm run knip
          - name: Type check and build for production
            run: pnpm run build
